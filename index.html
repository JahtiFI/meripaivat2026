<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lassejahti • Meripäivät 2026</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">Lassejahti</a>
      <ul class="nav-menu" id="nav-menu">
        <li><a href="index.html" class="active">Home</a></li>
        <li class="nav-dropdown">
          <a href="gallery.html">Galleries ▾</a>
          <div class="nav-dropdown-content" id="gallery-nav-links">
            <!-- Filled by JS -->
          </div>
        </li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <button class="nav-toggle" id="nav-toggle" aria-label="Menu">
        <i class="fas fa-bars"></i>
      </button>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>Capturing<br>Moments</h1>
      <p>Timeless photography that tells stories words never could.</p>
      <a href="gallery.html" class="cta-button">Explore the Collection</a>
    </div>
  </section>

  <section class="gallery-section">
    <h1>Galleries</h1>
    <p class="section-subtitle">Select a collection to explore</p>
    <div class="gallery-cards" id="gallery-cards">
      <!-- Filled by JS from data/galleries.json -->
    </div>
  </section>

  <footer>
    <div class="social-icons">
      <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="#" aria-label="Behance"><i class="fab fa-behance"></i></a>
      <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
      <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
    </div>
    <p class="copyright">© 2026 LENS Studio. All rights reserved.</p>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-content">
      <button class="lightbox-close" id="lightbox-close"><i class="fas fa-times"></i></button>
      <button class="lightbox-arrow left" id="lightbox-prev"><i class="fas fa-chevron-left"></i></button>
      <img id="lightbox-image" alt="">
      <div class="lightbox-caption">
        <h3 id="lightbox-title"></h3>
        <span id="lightbox-subtitle"></span>
      </div>
      <button class="lightbox-arrow right" id="lightbox-next"><i class="fas fa-chevron-right"></i></button>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
