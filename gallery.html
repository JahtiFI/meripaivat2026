<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery • Lasse Ahti Photography</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">Gallery • Lasse Ahti Photography</a>
      <ul class="nav-menu" id="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li class="nav-dropdown">
          <a href="gallery.html" class="active">Galleries ▾</a>
          <div class="nav-dropdown-content" id="gallery-nav-links">
            <!-- Filled by JS -->
          </div>
        </li>
        <!-- <li><a href="about.html">About</a></li> -->
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <button class="nav-toggle" id="nav-toggle" aria-label="Menu">
        <i class="fas fa-bars"></i>
      </button>
    </nav>
  </header>

  <section class="gallery-section">
    <h1 id="gallery-title">Gallery</h1>
    <p class="section-subtitle" id="gallery-subtitle">Loading...</p>

    <div class="gallery-grid" id="gallery-grid">
      <!-- Filled by JS -->
    </div>
  </section>

  <footer>
    <div class="social-icons">
      <a href="#"><i class="fab fa-instagram"></i></a>
      <!-- <a href="#"><i class="fab fa-behance"></i></a>
      <a href="#"><i class="fab fa-twitter"></i></a>
      <a href="#"><i class="fab fa-linkedin-in"></i></a> -->
    </div>
    <p class="copyright">© 2026 Lasse Ahti Photography. All rights reserved.</p>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-content">
      <button class="lightbox-close" id="lightbox-close"><i class="fas fa-times"></i></button>
      <button class="lightbox-arrow left" id="lightbox-prev"><i class="fas fa-chevron-left"></i></button>
      <img id="lightbox-image" alt="">
      <div class="lightbox-caption">
        <h3 id="lightbox-title"></h3>
        <span id="lightbox-subtitle"></span>
      </div>
      <button class="lightbox-arrow right" id="lightbox-next"><i class="fas fa-chevron-right"></i></button>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
