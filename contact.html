<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact • Lasse Ahti Photography • </title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">Lasse Ahti Photography</a>
      <ul class="nav-menu" id="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li class="nav-dropdown">
          <a href="gallery.html">Galleries ▾</a>
          <div class="nav-dropdown-content" id="gallery-nav-links"></div>
        </li>
        <!-- <li><a href="about.html">About</a></li> -->
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
      <button class="nav-toggle" id="nav-toggle" aria-label="Menu">
        <i class="fas fa-bars"></i>
      </button>
    </nav>
  </header>

  <main class="page-content contact">
    <h1>Let’s Create Something Unforgettable</h1>
    <form id="contact-form">
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Email Address" required>
      <textarea placeholder="Tell me about your project..." rows="6" required></textarea>
      <button type="submit">Send Message →</button>
    </form>
  </main>

  <footer>
    <div class="social-icons">
      <a href="https://www.instagram.com/lassejahti/" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <!-- <a href="#" aria-label="Behance"><i class="fab fa-behance"></i></a>
      <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
      <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
    </div> -->
    <p class="copyright">© 2026 Lasse Ahti Photography. All rights reserved.</p>
  </footer>

  <script src="assets/js/main.js"></script>
  <script>
    document.getElementById('contact-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = this.querySelector('button');
      btn.textContent = 'Sending...';
      setTimeout(() => {
        alert('Message received. I’ll get back to you soon.');
        this.reset();
        btn.textContent = 'Send Message →';
      }, 800);
    });
  </script>
</body>
</html>
